name: sincro_local
description: "Copia para o cartão SD e sincroniza com outro aparelho, sem nuvem."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  battery_plus: ^7.1.2
  wakelock_plus: ^1.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
